{
  "name": "CI",
  "on": {"pull_request": {}, "push": {"branches": ["main"]}},
  "jobs": {
    "test": {
      "runs-on": "windows-latest",
      "defaults": {"run": {"shell": "pwsh"}},
      "steps": [
        {"uses": "actions/checkout@v4", "with": {"fetch-depth": 0}},
        {"uses": "actions/setup-python@v5", "with": {"python-version": "3.14"}},
        {"name": "Install", "run": "python -m pip install -e .[dev]"},
        {"name": "Tests", "run": "$t = \"$env:RUNNER_TEMP\\nyx-pt-\" + (Get-Date -Format 'yyyyMMdd-HHmmss'); $env:PYTHONDONTWRITEBYTECODE='1'; python -m pytest -q -p no:cacheprovider --basetemp=$t"},
        {"name": "Docs", "run": "python -B scripts/check_docs.py --fix-none"}
      ]
    }
  }
}
